<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1044" viewBox="0 0 1600 1044" role="group" aria-labelledby="title desc">
<title id="title">Gradient boundary: where backward stops</title><desc id="desc">No GPU activities: sparse inputs and input distribution are outside the differentiable graph. Solid bars: logical execution/access scopes; hollow dashed bars: unconsumed requests. Blue H2D, red D2H/host sync, purple AllToAll, amber request wait, green stream dependency. finish TBE autograd node the local shard update is the last differentiable lookup work no Module.backward call BatchedFusedEmbedding is a forward wrapper no Module.backward call GroupedEmbeddingsLookup is a forward wrapper no gradient for indices or offsets the lookup receives integer KJT tensors input path is detached ShardedEmbeddingCollection.input_dist uses torch.no_grad</desc>
