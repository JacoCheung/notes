<text x="40" y="942" font-size="12" fill="#475569">Index calculation and KJT input distribution have no matching backward collective or CUDA kernel.</text>
<text x="40" y="963" font-size="12" fill="#475569">Fused embedding parameters are exposed without external gradients; a dense optimizer step does not update them.</text>
<text x="40" y="984" font-size="12" fill="#475569">Activity IDs, sizes, kernel names and optimizer details illustrate one execution configuration; they are not fixed for every run.</text>
<text x="40" y="1029" font-size="11" fill="#64748b">TorchRec 1d87b8f79b7b · logical scopes, not measured durations · blue H2D / red host sync / purple AllToAll</text></svg>
