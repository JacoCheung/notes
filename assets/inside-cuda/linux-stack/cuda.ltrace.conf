# CUDA Runtime API signatures for ltrace. cudaLaunchKernel's by-value dim3
# arguments are intentionally not described here: its fallback display shows
# raw ABI argument registers, not the source-level C++ parameter list.
int cudaSetDevice(int);
int cudaMalloc(addr, ulong);
int cudaMemcpy(addr, addr, ulong, int);
int cudaGetLastError(void);
int cudaDeviceSynchronize(void);
int cudaFree(addr);
