<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="800" viewBox="0 0 1080 800" role="img" aria-labelledby="title desc">
<title id="title">VPN encapsulation: an IP packet inside another IP path</title><desc id="desc">A virtual tunnel interface receives an inner IP packet. WireGuard encrypts it and sends outer UDP/IP through a physical interface. The gateway recovers and routes the inner packet.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#253449}a:hover text{text-decoration:underline}a:focus{outline:2px solid #2563eb}</style>
<rect width="1080" height="800" rx="12" fill="#fff"/>
<text x="30" y="40" font-size="24" font-weight="700">VPN encapsulation: an IP packet inside another IP path</text>
<text x="30" y="70" font-size="16" font-weight="400" style="fill:#64748b">Example: HTTPS over a layer-3 WireGuard VPN. Read each packet from outside to inside.</text>
<rect x="30" y="105" width="480" height="255" rx="8" fill="#eff6ff" stroke="#9bbcf5"/>
<text x="50" y="139" font-size="21" font-weight="700" style="fill:#253449">Before VPN encapsulation</text>
<text x="50" y="169" font-size="18" font-weight="400" style="fill:#2563eb">utun / wg interface: inner IP packet</text>
<rect x="50" y="190" width="440" height="42" rx="8" fill="#fff" stroke="#9bbcf5"/>
<text x="67" y="218" font-size="18" font-weight="400" style="fill:#253449">Inner IP: tunnel client → origin</text>
<rect x="50" y="240" width="440" height="42" rx="8" fill="#fff" stroke="#9bbcf5"/>
<text x="67" y="268" font-size="18" font-weight="400" style="fill:#253449">TCP: client ↔ origin</text>
<rect x="50" y="290" width="440" height="42" rx="8" fill="#fff" stroke="#9bbcf5"/>
<text x="67" y="318" font-size="18" font-weight="400" style="fill:#253449">TLS → HTTP</text>
<rect x="550" y="105" width="500" height="400" rx="8" fill="#fff5e8" stroke="#d6a86f"/>
<text x="570" y="139" font-size="21" font-weight="700" style="fill:#253449">On the physical interface</text>
<text x="570" y="169" font-size="18" font-weight="400" style="fill:#a45b07">Outer transport: client → VPN peer</text>
<rect x="570" y="190" width="460" height="42" rx="8" fill="#fff" stroke="#d6a86f"/>
<text x="587" y="218" font-size="18" font-weight="400" style="fill:#253449">Ethernet / Wi-Fi frame</text>
<rect x="570" y="240" width="460" height="42" rx="8" fill="#fff" stroke="#d6a86f"/>
<text x="587" y="268" font-size="18" font-weight="400" style="fill:#253449">Outer IP: client → VPN gateway</text>
<rect x="570" y="290" width="460" height="42" rx="8" fill="#fff" stroke="#d6a86f"/>
<text x="587" y="318" font-size="18" font-weight="400" style="fill:#253449">UDP: WireGuard endpoints</text>
<rect x="570" y="345" width="460" height="140" rx="8" fill="#ebf8f2" stroke="#7dbba4"/>
<text x="588" y="376" font-size="19" font-weight="700" style="fill:#087f68">WireGuard encrypted payload</text>
<text x="588" y="409" font-size="18" font-weight="400" style="fill:#253449">Whole inner IP packet</text>
<text x="588" y="438" font-size="18" font-weight="400" style="fill:#253449">Inner IP → TCP → TLS → HTTP</text>
<text x="50" y="399" font-size="18" font-weight="700" style="fill:#a45b07">VPN encrypts the whole inner packet.</text>
<text x="50" y="433" font-size="17" font-weight="400" style="fill:#253449">The original TCP state stays with</text>
<text x="50" y="458" font-size="17" font-weight="400" style="fill:#253449">the client and origin in this routed model.</text>
<rect x="30" y="535" width="1020" height="180" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="50" y="570" font-size="21" font-weight="700" style="fill:#253449">At the VPN gateway</text>
<text x="50" y="605" font-size="18" font-weight="400" style="fill:#253449">Remove outer encapsulation → recover inner IP → route to origin; apply NAT if configured.</text>
<text x="50" y="641" font-size="18" font-weight="400" style="fill:#253449">The origin sees the routed packet, not the outer UDP / WireGuard wrapper.</text>
<text x="50" y="677" font-size="17" font-weight="400" style="fill:#253449">A VPN interface name such as utun4 does not identify the outer VPN protocol.</text>
<a href="https://www.wireguard.com/protocol/" target="_blank" rel="noopener">
<text x="30" y="755" font-size="15" font-weight="400" style="fill:#2563eb">WireGuard protocol ↗</text>
</a>
<a href="https://www.wireguard.com/#cryptokey-routing" target="_blank" rel="noopener">
<text x="270" y="755" font-size="15" font-weight="400" style="fill:#2563eb">WireGuard routing ↗</text>
</a>
<a href="https://github.com/apple-oss-distributions/xnu/blob/main/bsd/net/if_utun.c" target="_blank" rel="noopener">
<text x="520" y="755" font-size="15" font-weight="400" style="fill:#2563eb">Apple utun implementation ↗</text>
</a>
</svg>
