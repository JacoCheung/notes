<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1040" viewBox="0 0 1080 1040" role="img" aria-labelledby="title desc">
<title id="title">ssh -R: remote listener, client-side target connection</title>
<desc id="desc">Time runs downward. Narrow activation bars show handling or relay intervals, not CPU utilization. Each message links to its protocol specification. TCP connections and logical TLS endpoints are labeled separately.</desc>
<defs>
<marker id="tcp" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
<marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#7540b8"/></marker>
<marker id="tls" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#087f68"/></marker>
<marker id="ssh" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#a45b07"/></marker>
<marker id="vpn" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#a45b07"/></marker>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#253449} .message{font-size:17px} a:hover text{text-decoration:underline} a:focus{outline:2px solid #2563eb}</style>
<rect width="1080" height="1040" rx="12" fill="#fff"/>
<text x="30" y="36" font-size="23" font-weight="700">ssh -R: remote listener, client-side target connection</text>
<text x="30" y="62" font-size="14" fill="#64748b">Time ↓ · bars = handling / relay intervals · click messages for protocol references ↗</text>
<rect x="24" y="680" width="1032" height="75" rx="8" fill="#fff5e8"/>
<line x1="120.0" x2="120.0" y1="140" y2="975" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="16.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="120.0" y="108" text-anchor="middle" font-size="18" font-weight="700">Visitor</text>
<text x="120.0" y="128" text-anchor="middle" font-size="14">curl on VM</text>
<line x1="400.0" x2="400.0" y1="140" y2="975" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="296.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="400.0" y="108" text-anchor="middle" font-size="18" font-weight="700">sshd</text>
<text x="400.0" y="128" text-anchor="middle" font-size="14">VM · listens on :18080</text>
<line x1="680.0" x2="680.0" y1="140" y2="975" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="576.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="680.0" y="108" text-anchor="middle" font-size="18" font-weight="700">SSH client</text>
<text x="680.0" y="128" text-anchor="middle" font-size="14">Mac · initiates SSH</text>
<line x1="960.0" x2="960.0" y1="140" y2="975" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="856.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="960.0" y="108" text-anchor="middle" font-size="18" font-weight="700">HTTP service</text>
<text x="960.0" y="128" text-anchor="middle" font-size="14">Mac · 127.0.0.1:8000</text>
<rect x="113.0" y="365" width="14" height="565" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="393.0" y="170" width="14" height="760" fill="#fff" stroke="#a45b07" stroke-width="1.6"/>
<rect x="673.0" y="170" width="14" height="760" fill="#fff" stroke="#a45b07" stroke-width="1.6"/>
<rect x="953.0" y="545" width="14" height="385" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener"><title>SSH connection initiated by the Mac · protocol reference</title>
<line x1="673.0" y1="195" x2="408.0" y2="195" stroke="#a45b07" stroke-width="2" marker-end="url(#ssh)"/>
<text class="message" x="540.0" y="162" text-anchor="middle" style="fill:#a45b07">SSH connection</text>
<text class="message" x="540.0" y="183" text-anchor="middle" style="fill:#a45b07">initiated by the Mac</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.1" target="_blank" rel="noopener"><title>tcpip-forward request VM loopback listener :18080 · protocol reference</title>
<line x1="673.0" y1="290" x2="408.0" y2="290" stroke="#a45b07" stroke-width="2" marker-end="url(#ssh)"/>
<text class="message" x="540.0" y="257" text-anchor="middle" style="fill:#a45b07">tcpip-forward request</text>
<text class="message" x="540.0" y="278" text-anchor="middle" style="fill:#a45b07">VM loopback listener :18080</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener"><title>TCP A → VM :18080 · protocol reference</title>
<line x1="127.0" y1="385" x2="392.0" y2="385" stroke="#2563eb" stroke-width="2" marker-end="url(#tcp)"/>
<text class="message" x="260.0" y="373" text-anchor="middle" style="fill:#2563eb">TCP A → VM :18080</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener"><title>Open forwarded-tcpip channel on the existing SSH connection · protocol reference</title>
<line x1="407.0" y1="470" x2="672.0" y2="470" stroke="#a45b07" stroke-width="2" marker-end="url(#ssh)"/>
<text class="message" x="540.0" y="437" text-anchor="middle" style="fill:#a45b07">Open forwarded-tcpip channel</text>
<text class="message" x="540.0" y="458" text-anchor="middle" style="fill:#a45b07">on the existing SSH connection</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener"><title>TCP C → Mac :8000 opened by SSH client · protocol reference</title>
<line x1="687.0" y1="560" x2="952.0" y2="560" stroke="#2563eb" stroke-width="2" marker-end="url(#tcp)"/>
<text class="message" x="820.0" y="527" text-anchor="middle" style="fill:#2563eb">TCP C → Mac :8000</text>
<text class="message" x="820.0" y="548" text-anchor="middle" style="fill:#2563eb">opened by SSH client</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener"><title>HTTP request bytes · protocol reference</title>
<line x1="127.0" y1="645" x2="392.0" y2="645" stroke="#7540b8" stroke-width="2" marker-end="url(#control)"/>
<text class="message" x="260.0" y="633" text-anchor="middle" style="fill:#7540b8">HTTP request bytes</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener"><title>Encrypted SSH channel data service traffic toward the Mac · protocol reference</title>
<line x1="407.0" y1="730" x2="672.0" y2="730" stroke="#a45b07" stroke-width="2" marker-end="url(#ssh)"/>
<text class="message" x="540.0" y="697" text-anchor="middle" style="fill:#a45b07">Encrypted SSH channel data</text>
<text class="message" x="540.0" y="718" text-anchor="middle" style="fill:#a45b07">service traffic toward the Mac</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener"><title>Original HTTP request bytes · protocol reference</title>
<line x1="687.0" y1="815" x2="952.0" y2="815" stroke="#7540b8" stroke-width="2" marker-end="url(#control)"/>
<text class="message" x="820.0" y="803" text-anchor="middle" style="fill:#7540b8">Original HTTP request bytes</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener"><title>Response relayed back (logical) through the same three TCP legs · protocol reference</title>
<line x1="953.0" y1="920" x2="128.0" y2="920" stroke="#7540b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#control)"/>
<text class="message" x="260.0" y="887" text-anchor="middle" style="fill:#7540b8">Response relayed back (logical)</text>
<text class="message" x="260.0" y="908" text-anchor="middle" style="fill:#7540b8">through the same three TCP legs</text>
</a>
<text x="30" y="980" font-size="16" fill="#475569">SSH TCP B was initiated Mac → VM; the forwarded request uses it in the opposite direction.</text>
<text x="30" y="1018" font-size="14">Blue: TCP setup · purple: proxy control / HTTP · green: origin TLS · amber: encrypted SSH channel</text>
</svg>
