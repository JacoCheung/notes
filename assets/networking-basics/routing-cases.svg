<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="880" viewBox="0 0 1080 880" role="img" aria-labelledby="title desc">
<title id="title">Application proxy selection × IP routing</title><desc id="desc">Five viable path classes for a private application proxy P1 reachable only over VPN, a public system proxy P2, and a public origin O. This is a path model, not packet capture.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#253449}a:hover text{text-decoration:underline}a:focus{outline:2px solid #2563eb}</style>
<rect width="1080" height="880" rx="12" fill="#fff"/>
<text x="30" y="40" font-size="24" font-weight="700">Application proxy selection × IP routing</text>
<text x="30" y="73" font-size="16" font-weight="400" style="fill:#64748b">Scope: new external IPv4/TCP connections; no extra proxy chains or per-app routing rules.</text>
<rect x="30" y="100" width="1020" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="50" y="133" font-size="19" font-weight="700" style="fill:#253449">1. The request implementation selects P₁, P₂ or DIRECT.</text>
<text x="50" y="165" font-size="19" font-weight="400" style="fill:#253449">2. The OS routes that socket destination. DIRECT can still use the VPN.</text>
<rect x="30" y="210" width="1020" height="78" rx="8" fill="#fff5e8" stroke="#a45b07"/>
<text x="50" y="256" font-size="28" font-weight="700" style="fill:#a45b07">A</text>
<text x="105" y="240" font-size="18" font-weight="700" style="fill:#a45b07">Private proxy P₁</text>
<text x="105" y="269" font-size="19" font-weight="400" style="fill:#253449">Mac → VPN → P₁ → proxy-side egress → origin</text>
<rect x="30" y="302" width="1020" height="78" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="50" y="348" font-size="28" font-weight="700" style="fill:#2563eb">B</text>
<text x="105" y="332" font-size="18" font-weight="700" style="fill:#2563eb">Public proxy P₂</text>
<text x="105" y="361" font-size="19" font-weight="400" style="fill:#253449">Mac → ordinary network → P₂ → proxy-side egress → origin</text>
<rect x="30" y="394" width="1020" height="78" rx="8" fill="#fff5e8" stroke="#a45b07"/>
<text x="50" y="440" font-size="28" font-weight="700" style="fill:#a45b07">C</text>
<text x="105" y="424" font-size="18" font-weight="700" style="fill:#a45b07">Public proxy P₂</text>
<text x="105" y="453" font-size="19" font-weight="400" style="fill:#253449">Mac → VPN → P₂ → proxy-side egress → origin</text>
<rect x="30" y="486" width="1020" height="78" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="50" y="532" font-size="28" font-weight="700" style="fill:#2563eb">D</text>
<text x="105" y="516" font-size="18" font-weight="700" style="fill:#2563eb">DIRECT</text>
<text x="105" y="545" font-size="19" font-weight="400" style="fill:#253449">Mac → ordinary network → origin</text>
<rect x="30" y="578" width="1020" height="78" rx="8" fill="#fff5e8" stroke="#a45b07"/>
<text x="50" y="624" font-size="28" font-weight="700" style="fill:#a45b07">E</text>
<text x="105" y="608" font-size="18" font-weight="700" style="fill:#a45b07">DIRECT</text>
<text x="105" y="637" font-size="19" font-weight="400" style="fill:#253449">Mac → VPN → origin</text>
<rect x="30" y="688" width="1020" height="117" rx="8" fill="#fff1f2" stroke="#e5a2ac"/>
<text x="50" y="720" font-size="18" font-weight="700" style="fill:#a3293d">P₁ over the ordinary network: unreachable under the stated premise.</text>
<text x="50" y="753" font-size="17" font-weight="400" style="fill:#253449">A fixed private proxy does not automatically fall back to the public system proxy.</text>
<text x="50" y="781" font-size="17" font-weight="400" style="fill:#253449">DNS, IPv6, UDP, local connections and explicit fallback lists need separate analysis.</text>
<a href="https://www.electronjs.org/docs/latest/api/structures/proxy-config" target="_blank" rel="noopener">
<text x="30" y="847" font-size="15" font-weight="400" style="fill:#2563eb">Electron proxy modes ↗</text>
</a>
<a href="https://chromium.googlesource.com/chromium/src/+/HEAD/net/docs/proxy.md" target="_blank" rel="noopener">
<text x="310" y="847" font-size="15" font-weight="400" style="fill:#2563eb">Chromium proxy selection ↗</text>
</a>
</svg>
