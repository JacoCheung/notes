<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="940" viewBox="0 0 1080 940" role="img" aria-labelledby="title desc">
<title id="title">Private HTTP proxy over VPN: two application TCP legs</title>
<desc id="desc">Time runs downward. Narrow activation bars show handling or relay intervals, not CPU utilization. Each message links to its protocol specification. TCP connections and logical TLS endpoints are labeled separately.</desc>
<defs>
<marker id="tcp" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
<marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#7540b8"/></marker>
<marker id="tls" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#087f68"/></marker>
<marker id="ssh" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#a45b07"/></marker>
<marker id="vpn" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#a45b07"/></marker>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#253449} .message{font-size:17px} a:hover text{text-decoration:underline} a:focus{outline:2px solid #2563eb}</style>
<rect width="1080" height="940" rx="12" fill="#fff"/>
<text x="30" y="36" font-size="23" font-weight="700">Private HTTP proxy over VPN: two application TCP legs</text>
<text x="30" y="62" font-size="14" fill="#64748b">Time ↓ · bars = handling / relay intervals · click messages for protocol references ↗</text>
<rect x="24" y="160" width="1032" height="65" rx="8" fill="#fff5e8"/>
<rect x="24" y="390" width="1032" height="75" rx="8" fill="#f7f2fc"/>
<rect x="24" y="670" width="1032" height="170" rx="8" fill="#ebf8f2"/>
<line x1="120.0" x2="120.0" y1="140" y2="875" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="16.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="120.0" y="108" text-anchor="middle" font-size="18" font-weight="700">Client</text>
<text x="120.0" y="128" text-anchor="middle" font-size="14">Mac · VPN + proxy config</text>
<line x1="400.0" x2="400.0" y1="140" y2="875" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="296.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="400.0" y="108" text-anchor="middle" font-size="18" font-weight="700">VPN gateway</text>
<text x="400.0" y="128" text-anchor="middle" font-size="14">packet routing / decapsulation</text>
<line x1="680.0" x2="680.0" y1="140" y2="875" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="576.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="680.0" y="108" text-anchor="middle" font-size="18" font-weight="700">Private proxy</text>
<text x="680.0" y="128" text-anchor="middle" font-size="14">10.77.0.10:18888</text>
<line x1="960.0" x2="960.0" y1="140" y2="875" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="856.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="960.0" y="108" text-anchor="middle" font-size="18" font-weight="700">Origin</text>
<text x="960.0" y="128" text-anchor="middle" font-size="14">example.com:443</text>
<rect x="113.0" y="170" width="14" height="665" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="393.0" y="180" width="14" height="655" fill="#fff" stroke="#a45b07" stroke-width="1.6"/>
<rect x="673.0" y="255" width="14" height="580" fill="#fff" stroke="#7540b8" stroke-width="1.6"/>
<rect x="953.0" y="510" width="14" height="325" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<a href="https://www.wireguard.com/protocol/" target="_blank" rel="noopener"><title>Outer WireGuard packet contains inner TCP SYN to proxy · protocol reference</title>
<line x1="127.0" y1="195" x2="392.0" y2="195" stroke="#a45b07" stroke-width="2" marker-end="url(#vpn)"/>
<text class="message" x="260.0" y="162" text-anchor="middle" style="fill:#a45b07">Outer WireGuard packet</text>
<text class="message" x="260.0" y="183" text-anchor="middle" style="fill:#a45b07">contains inner TCP SYN to proxy</text>
</a>
<a href="https://www.wireguard.com/protocol/" target="_blank" rel="noopener"><title>Route inner TCP SYN to private proxy · protocol reference</title>
<line x1="407.0" y1="275" x2="672.0" y2="275" stroke="#2563eb" stroke-width="2" marker-end="url(#tcp)"/>
<text class="message" x="540.0" y="242" text-anchor="middle" style="fill:#2563eb">Route inner TCP SYN</text>
<text class="message" x="540.0" y="263" text-anchor="middle" style="fill:#2563eb">to private proxy</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.6" target="_blank" rel="noopener"><title>TCP A established (logical) client ↔ proxy, via VPN · protocol reference</title>
<line x1="673.0" y1="355" x2="128.0" y2="355" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tcp)"/>
<text class="message" x="260.0" y="322" text-anchor="middle" style="fill:#2563eb">TCP A established (logical)</text>
<text class="message" x="260.0" y="343" text-anchor="middle" style="fill:#2563eb">client ↔ proxy, via VPN</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.6" target="_blank" rel="noopener"><title>CONNECT example.com:443 carried over TCP A + VPN · protocol reference</title>
<line x1="127.0" y1="440" x2="672.0" y2="440" stroke="#7540b8" stroke-width="2" marker-end="url(#control)"/>
<text class="message" x="260.0" y="407" text-anchor="middle" style="fill:#7540b8">CONNECT example.com:443</text>
<text class="message" x="260.0" y="428" text-anchor="middle" style="fill:#7540b8">carried over TCP A + VPN</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.6" target="_blank" rel="noopener"><title>TCP B → origin:443 proxy-side route and egress · protocol reference</title>
<line x1="687.0" y1="530" x2="952.0" y2="530" stroke="#2563eb" stroke-width="2" marker-end="url(#tcp)"/>
<text class="message" x="820.0" y="497" text-anchor="middle" style="fill:#2563eb">TCP B → origin:443</text>
<text class="message" x="820.0" y="518" text-anchor="middle" style="fill:#2563eb">proxy-side route and egress</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.6" target="_blank" rel="noopener"><title>200 Connection established returned over TCP A + VPN · protocol reference</title>
<line x1="673.0" y1="620" x2="128.0" y2="620" stroke="#7540b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#control)"/>
<text class="message" x="260.0" y="587" text-anchor="middle" style="fill:#7540b8">200 Connection established</text>
<text class="message" x="260.0" y="608" text-anchor="middle" style="fill:#7540b8">returned over TCP A + VPN</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc8446.html#section-2" target="_blank" rel="noopener"><title>Client-origin TLS (logical) proxy relays TCP A ↔ TCP B · protocol reference</title>
<line x1="127.0" y1="720" x2="952.0" y2="720" stroke="#087f68" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tls)"/>
<text class="message" x="260.0" y="687" text-anchor="middle" style="fill:#087f68">Client-origin TLS (logical)</text>
<text class="message" x="260.0" y="708" text-anchor="middle" style="fill:#087f68">proxy relays TCP A ↔ TCP B</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.6" target="_blank" rel="noopener"><title>Relay origin TLS bytes on the separate TCP B · protocol reference</title>
<line x1="687.0" y1="810" x2="952.0" y2="810" stroke="#087f68" stroke-width="2" marker-end="url(#tls)"/>
<text class="message" x="820.0" y="777" text-anchor="middle" style="fill:#087f68">Relay origin TLS bytes</text>
<text class="message" x="820.0" y="798" text-anchor="middle" style="fill:#087f68">on the separate TCP B</text>
</a>
<text x="30" y="872" font-size="16" fill="#475569">VPN gateway routes packets; the proxy opens TCP B. Long arrows denote logical endpoints.</text>
<text x="30" y="918" font-size="14">Blue: TCP setup · purple: CONNECT control · green: origin TLS · amber: encrypted VPN transport</text>
</svg>
