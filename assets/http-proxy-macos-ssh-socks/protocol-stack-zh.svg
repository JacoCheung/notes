<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="860" viewBox="0 0 1080 860" role="img" aria-labelledby="title desc">
<title id="title">HTTP、SOCKS5 与 SSH 的协议栈</title>
<desc id="desc">三者都运行在 TCP 之上。应用层框内区分建立连接与数据传输两个阶段；SSH 加密 channel 承载应用字节，SOCKS5 的 L5 标注是功能类比。</desc>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253449}a:hover text{text-decoration:underline}a:focus{outline:2px solid #2563eb}</style>
<rect width="1080" height="860" rx="12" fill="#fff"/>
<text x="30" y="38" font-size="25" font-weight="700" style="fill:#253449">HTTP、SOCKS5 与 SSH 的协议栈</text>
<text x="30" y="68" font-size="17" font-weight="400" style="fill:#64748b">TCP/IP 四层模型 · HTTP/1.1、SOCKS5 CONNECT 与 SSH -L / -D</text>
<text x="30" y="122" font-size="18" font-weight="700" style="fill:#253449">TCP/IP 层次</text>
<text x="30" y="202" font-size="20" font-weight="700" style="fill:#253449">应用层</text>
<text x="30" y="230" font-size="16" font-weight="400" style="fill:#64748b">≈ OSI L5–L7</text>
<text x="30" y="274" font-size="16" font-weight="400" style="fill:#253449">① 建立连接</text>
<text x="30" y="378" font-size="16" font-weight="400" style="fill:#253449">② 数据传输</text>
<text x="30" y="522" font-size="20" font-weight="700" style="fill:#253449">传输层</text>
<text x="30" y="546" font-size="16" font-weight="400" style="fill:#64748b">OSI L4</text>
<text x="30" y="596" font-size="18" font-weight="700" style="fill:#253449">网络层 · L3</text>
<text x="30" y="658" font-size="18" font-weight="700" style="fill:#253449">链路层 · L2</text>
<text x="198" y="122" font-size="17" font-weight="700" style="fill:#253449">客户端 → HTTP 代理</text>
<rect x="186" y="168" width="272" height="300" rx="8" fill="#f7f2fc" stroke="#7540b8"/>
<a href="https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.6" target="_blank" rel="noopener">
<text x="202" y="202" font-size="23" font-weight="700" style="fill:#7540b8">HTTP proxy ↗</text>
</a>
<text x="202" y="230" font-size="16" font-weight="400" style="fill:#7540b8">应用层协议 · OSI L7</text>
<text x="202" y="274" font-size="17" font-weight="700" style="fill:#253449">HTTP 代理请求</text>
<text x="202" y="302" font-size="16" font-weight="400" style="fill:#253449">GET absolute-URI</text>
<text x="202" y="326" font-size="16" font-weight="400" style="fill:#253449">或 CONNECT host:port</text>
<line x1="202" x2="442" y1="350" y2="350" stroke="#7540b8" opacity=".35"/>
<text x="202" y="380" font-size="16" font-weight="400" style="fill:#253449">HTTP 请求 / 响应</text>
<text x="202" y="404" font-size="16" font-weight="400" style="fill:#253449">或 CONNECT 后的源站 TLS 字节</text>
<rect x="186" y="492" width="272" height="66" rx="8" fill="#eff6ff" stroke="#9bbcf5"/>
<text x="202" y="521" font-size="21" font-weight="700" style="fill:#2563eb">TCP</text>
<text x="202" y="546" font-size="16" font-weight="400" style="fill:#2563eb">客户端 ↔ HTTP 代理</text>
<rect x="186" y="568" width="272" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="202" y="600" font-size="21" font-weight="700" style="fill:#253449">IP</text>
<rect x="186" y="628" width="272" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="202" y="660" font-size="19" font-weight="400" style="fill:#253449">Ethernet / Wi-Fi</text>
<text x="494" y="122" font-size="17" font-weight="700" style="fill:#253449">客户端 → SOCKS 代理</text>
<rect x="482" y="168" width="272" height="300" rx="8" fill="#f7f2fc" stroke="#7540b8"/>
<a href="https://www.rfc-editor.org/rfc/rfc1928.html#section-4" target="_blank" rel="noopener">
<text x="498" y="202" font-size="23" font-weight="700" style="fill:#7540b8">SOCKS5 ↗</text>
</a>
<text x="498" y="230" font-size="16" font-weight="400" style="fill:#7540b8">TCP/IP 应用层 · OSI L5*</text>
<text x="498" y="274" font-size="17" font-weight="700" style="fill:#253449">SOCKS5 握手</text>
<text x="498" y="302" font-size="16" font-weight="400" style="fill:#253449">认证方法协商</text>
<text x="498" y="326" font-size="16" font-weight="400" style="fill:#253449">CONNECT 目标地址与端口</text>
<line x1="498" x2="738" y1="350" y2="350" stroke="#7540b8" opacity=".35"/>
<text x="498" y="380" font-size="16" font-weight="400" style="fill:#253449">转发应用字节流</text>
<text x="498" y="404" font-size="16" font-weight="400" style="fill:#253449">可承载源站 TLS 字节</text>
<rect x="482" y="492" width="272" height="66" rx="8" fill="#eff6ff" stroke="#9bbcf5"/>
<text x="498" y="521" font-size="21" font-weight="700" style="fill:#2563eb">TCP</text>
<text x="498" y="546" font-size="16" font-weight="400" style="fill:#2563eb">客户端 ↔ SOCKS 代理</text>
<rect x="482" y="568" width="272" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="498" y="600" font-size="21" font-weight="700" style="fill:#253449">IP</text>
<rect x="482" y="628" width="272" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="498" y="660" font-size="19" font-weight="400" style="fill:#253449">Ethernet / Wi-Fi</text>
<text x="790" y="122" font-size="17" font-weight="700" style="fill:#253449">SSH 客户端 → sshd</text>
<rect x="778" y="168" width="272" height="300" rx="8" fill="#fff5e8" stroke="#a45b07"/>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener">
<text x="794" y="202" font-size="23" font-weight="700" style="fill:#a45b07">SSH tunnel ↗</text>
</a>
<text x="794" y="230" font-size="16" font-weight="400" style="fill:#a45b07">应用层协议 · OSI L7</text>
<text x="794" y="274" font-size="17" font-weight="700" style="fill:#253449">SSH 连接与 channel</text>
<text x="794" y="302" font-size="16" font-weight="400" style="fill:#253449">密钥交换 / 认证</text>
<text x="794" y="326" font-size="16" font-weight="400" style="fill:#253449">打开 direct-tcpip channel</text>
<line x1="794" x2="1034" y1="350" y2="350" stroke="#a45b07" opacity=".35"/>
<text x="794" y="380" font-size="16" font-weight="400" style="fill:#253449">SSH 加密 channel data</text>
<text x="794" y="404" font-size="16" font-weight="400" style="fill:#253449">内部可承载源站 TLS 字节</text>
<rect x="778" y="492" width="272" height="66" rx="8" fill="#eff6ff" stroke="#9bbcf5"/>
<text x="794" y="521" font-size="21" font-weight="700" style="fill:#2563eb">TCP</text>
<text x="794" y="546" font-size="16" font-weight="400" style="fill:#2563eb">SSH 客户端 ↔ sshd</text>
<rect x="778" y="568" width="272" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="794" y="600" font-size="21" font-weight="700" style="fill:#253449">IP</text>
<rect x="778" y="628" width="272" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="794" y="660" font-size="19" font-weight="400" style="fill:#253449">Ethernet / Wi-Fi</text>
<text x="30" y="719" font-size="16" font-weight="400" style="fill:#475569">① → ② 是时间顺序：CONNECT / SOCKS5 握手头不会附加在后续每段应用数据上。</text>
<text x="30" y="747" font-size="16" font-weight="400" style="fill:#475569">* SOCKS5 的 L5 是功能类比；RFC 1928 将其描述为应用层与传输层之间的 shim。</text>
<text x="30" y="775" font-size="16" font-weight="400" style="fill:#475569">ssh -D 的 SOCKS 握手在本地 SSH 客户端终止；到 sshd 的链路承载 SSH channel。</text>
<text x="30" y="803" font-size="16" font-weight="400" style="fill:#475569">SSH channel 转发应用字节，不包含应用连接的完整 TCP / IP 包。</text>
<a href="https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.6" target="_blank" rel="noopener">
<text x="30" y="839" font-size="15" font-weight="400" style="fill:#2563eb">HTTP CONNECT ↗</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc1928.html#section-4" target="_blank" rel="noopener">
<text x="235" y="839" font-size="15" font-weight="400" style="fill:#2563eb">SOCKS5 ↗</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener">
<text x="382" y="839" font-size="15" font-weight="400" style="fill:#2563eb">SSH channels ↗</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4253.html#section-6" target="_blank" rel="noopener">
<text x="582" y="839" font-size="15" font-weight="400" style="fill:#2563eb">SSH encryption ↗</text>
</a>
</svg>
