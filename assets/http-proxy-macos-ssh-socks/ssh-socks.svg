<text x="30" y="1044" font-size="16" fill="#475569">socks5h sends the hostname to the local SSH client. The VM needs sshd, not a separate SOCKS daemon.</text>
<text x="30" y="1078" font-size="14">Blue: TCP setup · purple: proxy control / HTTP · green: origin TLS · amber: encrypted SSH channel</text>
