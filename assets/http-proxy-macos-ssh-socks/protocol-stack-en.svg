<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="860" viewBox="0 0 1080 860" role="img" aria-labelledby="title desc">
<title id="title">HTTP, SOCKS5 and SSH in the protocol stack</title>
<desc id="desc">All three run above TCP. Application-layer boxes distinguish connection setup from data transfer. SSH channels carry application bytes. SOCKS5 at OSI L5 is a functional analogy.</desc>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#253449}a:hover text{text-decoration:underline}a:focus{outline:2px solid #2563eb}</style>
<rect width="1080" height="860" rx="12" fill="#fff"/>
<text x="30" y="38" font-size="25" font-weight="700" style="fill:#253449">HTTP, SOCKS5 and SSH in the protocol stack</text>
<text x="30" y="68" font-size="17" font-weight="400" style="fill:#64748b">TCP/IP model · HTTP/1.1, SOCKS5 CONNECT and SSH -L / -D</text>
<text x="30" y="122" font-size="18" font-weight="700" style="fill:#253449">TCP/IP layer</text>
<text x="30" y="202" font-size="20" font-weight="700" style="fill:#253449">Application</text>
<text x="30" y="230" font-size="16" font-weight="400" style="fill:#64748b">≈ OSI L5–L7</text>
<text x="30" y="274" font-size="16" font-weight="400" style="fill:#253449">① Setup</text>
<text x="30" y="378" font-size="16" font-weight="400" style="fill:#253449">② Transfer</text>
<text x="30" y="522" font-size="20" font-weight="700" style="fill:#253449">Transport</text>
<text x="30" y="546" font-size="16" font-weight="400" style="fill:#64748b">OSI L4</text>
<text x="30" y="596" font-size="18" font-weight="700" style="fill:#253449">Internet · L3</text>
<text x="30" y="658" font-size="18" font-weight="700" style="fill:#253449">Link · L2</text>
<text x="198" y="122" font-size="17" font-weight="700" style="fill:#253449">Client → HTTP proxy</text>
<rect x="186" y="168" width="272" height="300" rx="8" fill="#f7f2fc" stroke="#7540b8"/>
<a href="https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.6" target="_blank" rel="noopener">
<text x="202" y="202" font-size="23" font-weight="700" style="fill:#7540b8">HTTP proxy ↗</text>
</a>
<text x="202" y="230" font-size="16" font-weight="400" style="fill:#7540b8">Application protocol · OSI L7</text>
<text x="202" y="274" font-size="17" font-weight="700" style="fill:#253449">HTTP proxy request</text>
<text x="202" y="302" font-size="16" font-weight="400" style="fill:#253449">GET absolute-URI</text>
<text x="202" y="326" font-size="16" font-weight="400" style="fill:#253449">or CONNECT host:port</text>
<line x1="202" x2="442" y1="350" y2="350" stroke="#7540b8" opacity=".35"/>
<text x="202" y="380" font-size="16" font-weight="400" style="fill:#253449">HTTP request / response</text>
<text x="202" y="404" font-size="16" font-weight="400" style="fill:#253449">or origin TLS after CONNECT</text>
<rect x="186" y="492" width="272" height="66" rx="8" fill="#eff6ff" stroke="#9bbcf5"/>
<text x="202" y="521" font-size="21" font-weight="700" style="fill:#2563eb">TCP</text>
<text x="202" y="546" font-size="16" font-weight="400" style="fill:#2563eb">Client ↔ HTTP proxy</text>
<rect x="186" y="568" width="272" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="202" y="600" font-size="21" font-weight="700" style="fill:#253449">IP</text>
<rect x="186" y="628" width="272" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="202" y="660" font-size="19" font-weight="400" style="fill:#253449">Ethernet / Wi-Fi</text>
<text x="494" y="122" font-size="17" font-weight="700" style="fill:#253449">Client → SOCKS proxy</text>
<rect x="482" y="168" width="272" height="300" rx="8" fill="#f7f2fc" stroke="#7540b8"/>
<a href="https://www.rfc-editor.org/rfc/rfc1928.html#section-4" target="_blank" rel="noopener">
<text x="498" y="202" font-size="23" font-weight="700" style="fill:#7540b8">SOCKS5 ↗</text>
</a>
<text x="498" y="230" font-size="16" font-weight="400" style="fill:#7540b8">TCP/IP application · OSI L5*</text>
<text x="498" y="274" font-size="17" font-weight="700" style="fill:#253449">SOCKS5 handshake</text>
<text x="498" y="302" font-size="16" font-weight="400" style="fill:#253449">Method negotiation</text>
<text x="498" y="326" font-size="16" font-weight="400" style="fill:#253449">CONNECT target host:port</text>
<line x1="498" x2="738" y1="350" y2="350" stroke="#7540b8" opacity=".35"/>
<text x="498" y="380" font-size="16" font-weight="400" style="fill:#253449">Relayed application bytes</text>
<text x="498" y="404" font-size="16" font-weight="400" style="fill:#253449">can carry origin TLS bytes</text>
<rect x="482" y="492" width="272" height="66" rx="8" fill="#eff6ff" stroke="#9bbcf5"/>
<text x="498" y="521" font-size="21" font-weight="700" style="fill:#2563eb">TCP</text>
<text x="498" y="546" font-size="16" font-weight="400" style="fill:#2563eb">Client ↔ SOCKS proxy</text>
<rect x="482" y="568" width="272" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="498" y="600" font-size="21" font-weight="700" style="fill:#253449">IP</text>
<rect x="482" y="628" width="272" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="498" y="660" font-size="19" font-weight="400" style="fill:#253449">Ethernet / Wi-Fi</text>
<text x="790" y="122" font-size="17" font-weight="700" style="fill:#253449">SSH client → sshd</text>
<rect x="778" y="168" width="272" height="300" rx="8" fill="#fff5e8" stroke="#a45b07"/>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener">
<text x="794" y="202" font-size="23" font-weight="700" style="fill:#a45b07">SSH tunnel ↗</text>
</a>
<text x="794" y="230" font-size="16" font-weight="400" style="fill:#a45b07">Application protocol · OSI L7</text>
<text x="794" y="274" font-size="17" font-weight="700" style="fill:#253449">SSH connection and channel</text>
<text x="794" y="302" font-size="16" font-weight="400" style="fill:#253449">Key exchange / authentication</text>
<text x="794" y="326" font-size="16" font-weight="400" style="fill:#253449">Open a direct-tcpip channel</text>
<line x1="794" x2="1034" y1="350" y2="350" stroke="#a45b07" opacity=".35"/>
<text x="794" y="380" font-size="16" font-weight="400" style="fill:#253449">Encrypted SSH channel data</text>
<text x="794" y="404" font-size="16" font-weight="400" style="fill:#253449">can contain origin TLS bytes</text>
<rect x="778" y="492" width="272" height="66" rx="8" fill="#eff6ff" stroke="#9bbcf5"/>
<text x="794" y="521" font-size="21" font-weight="700" style="fill:#2563eb">TCP</text>
<text x="794" y="546" font-size="16" font-weight="400" style="fill:#2563eb">SSH client ↔ sshd</text>
<rect x="778" y="568" width="272" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="794" y="600" font-size="21" font-weight="700" style="fill:#253449">IP</text>
<rect x="778" y="628" width="272" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="794" y="660" font-size="19" font-weight="400" style="fill:#253449">Ethernet / Wi-Fi</text>
<text x="30" y="719" font-size="16" font-weight="400" style="fill:#475569">① → ② is a phase change: CONNECT / SOCKS5 setup headers do not wrap each later chunk of data.</text>
<text x="30" y="747" font-size="16" font-weight="400" style="fill:#475569">* OSI L5 is a functional analogy; RFC 1928 describes a shim between application and transport.</text>
<text x="30" y="775" font-size="16" font-weight="400" style="fill:#475569">With ssh -D, SOCKS terminates at the local SSH client; the remote hop carries SSH channels.</text>
<text x="30" y="803" font-size="16" font-weight="400" style="fill:#475569">SSH channel data carries application bytes, not the application connection’s complete TCP / IP packets.</text>
<a href="https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.6" target="_blank" rel="noopener">
<text x="30" y="839" font-size="15" font-weight="400" style="fill:#2563eb">HTTP CONNECT ↗</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc1928.html#section-4" target="_blank" rel="noopener">
<text x="235" y="839" font-size="15" font-weight="400" style="fill:#2563eb">SOCKS5 ↗</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener">
<text x="382" y="839" font-size="15" font-weight="400" style="fill:#2563eb">SSH channels ↗</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4253.html#section-6" target="_blank" rel="noopener">
<text x="582" y="839" font-size="15" font-weight="400" style="fill:#2563eb">SSH encryption ↗</text>
</a>
</svg>
