<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="850" viewBox="0 0 1080 850" role="img" aria-labelledby="title desc">
<title id="title">ssh -L: fixed destination, original application bytes</title>
<desc id="desc">Time runs downward. Narrow activation bars show handling or relay intervals, not CPU utilization. Each message links to its protocol specification. TCP connections and logical TLS endpoints are labeled separately.</desc>
<defs>
<marker id="tcp" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
<marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#7540b8"/></marker>
<marker id="tls" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#087f68"/></marker>
<marker id="ssh" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#a45b07"/></marker>
<marker id="vpn" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#a45b07"/></marker>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#253449} .message{font-size:17px} a:hover text{text-decoration:underline} a:focus{outline:2px solid #2563eb}</style>
<rect width="1080" height="850" rx="12" fill="#fff"/>
<text x="30" y="36" font-size="23" font-weight="700">ssh -L: fixed destination, original application bytes</text>
<text x="30" y="62" font-size="14" fill="#64748b">Time ↓ · bars = handling / relay intervals · click messages for protocol references ↗</text>
<rect x="24" y="548" width="1032" height="60" rx="8" fill="#fff5e8"/>
<line x1="120.0" x2="120.0" y1="140" y2="785" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="16.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="120.0" y="108" text-anchor="middle" font-size="18" font-weight="700">Application</text>
<text x="120.0" y="128" text-anchor="middle" font-size="14">Mac · unmodified protocol</text>
<line x1="400.0" x2="400.0" y1="140" y2="785" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="296.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="400.0" y="108" text-anchor="middle" font-size="18" font-weight="700">SSH client</text>
<text x="400.0" y="128" text-anchor="middle" font-size="14">Mac · listens on :18080</text>
<line x1="680.0" x2="680.0" y1="140" y2="785" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="576.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="680.0" y="108" text-anchor="middle" font-size="18" font-weight="700">sshd</text>
<text x="680.0" y="128" text-anchor="middle" font-size="14">VM · encrypted SSH peer</text>
<line x1="960.0" x2="960.0" y1="140" y2="785" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="856.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="960.0" y="108" text-anchor="middle" font-size="18" font-weight="700">HTTP service</text>
<text x="960.0" y="128" text-anchor="middle" font-size="14">VM · 127.0.0.1:8000</text>
<rect x="113.0" y="190" width="14" height="554" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="393.0" y="180" width="14" height="564" fill="#fff" stroke="#a45b07" stroke-width="1.6"/>
<rect x="673.0" y="180" width="14" height="564" fill="#fff" stroke="#a45b07" stroke-width="1.6"/>
<rect x="953.0" y="410" width="14" height="334" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener"><title>SSH connection already established TCP + encryption + authentication · protocol reference</title>
<line x1="407.0" y1="195" x2="672.0" y2="195" stroke="#a45b07" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ssh)"/>
<text class="message" x="540.0" y="162" text-anchor="middle" style="fill:#a45b07">SSH connection already established</text>
<text class="message" x="540.0" y="183" text-anchor="middle" style="fill:#a45b07">TCP + encryption + authentication</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener"><title>TCP → 127.0.0.1:18080 · protocol reference</title>
<line x1="127.0" y1="285" x2="392.0" y2="285" stroke="#2563eb" stroke-width="2" marker-end="url(#tcp)"/>
<text class="message" x="260.0" y="273" text-anchor="middle" style="fill:#2563eb">TCP → 127.0.0.1:18080</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener"><title>Open direct-tcpip channel fixed target: 127.0.0.1:8000 · protocol reference</title>
<line x1="407.0" y1="350" x2="672.0" y2="350" stroke="#a45b07" stroke-width="2" marker-end="url(#ssh)"/>
<text class="message" x="540.0" y="317" text-anchor="middle" style="fill:#a45b07">Open direct-tcpip channel</text>
<text class="message" x="540.0" y="338" text-anchor="middle" style="fill:#a45b07">fixed target: 127.0.0.1:8000</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener"><title>TCP → 127.0.0.1:8000 on the VM · protocol reference</title>
<line x1="687.0" y1="425" x2="952.0" y2="425" stroke="#2563eb" stroke-width="2" marker-end="url(#tcp)"/>
<text class="message" x="820.0" y="392" text-anchor="middle" style="fill:#2563eb">TCP → 127.0.0.1:8000</text>
<text class="message" x="820.0" y="413" text-anchor="middle" style="fill:#2563eb">on the VM</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener"><title>GET / HTTP/1.1 original application bytes · protocol reference</title>
<line x1="127.0" y1="510" x2="392.0" y2="510" stroke="#7540b8" stroke-width="2" marker-end="url(#control)"/>
<text class="message" x="260.0" y="477" text-anchor="middle" style="fill:#7540b8">GET / HTTP/1.1</text>
<text class="message" x="260.0" y="498" text-anchor="middle" style="fill:#7540b8">original application bytes</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener"><title>SSH channel data encrypted between SSH peers · protocol reference</title>
<line x1="407.0" y1="590" x2="672.0" y2="590" stroke="#a45b07" stroke-width="2" marker-end="url(#ssh)"/>
<text class="message" x="540.0" y="557" text-anchor="middle" style="fill:#a45b07">SSH channel data</text>
<text class="message" x="540.0" y="578" text-anchor="middle" style="fill:#a45b07">encrypted between SSH peers</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener"><title>GET / HTTP/1.1 bytes restored by sshd · protocol reference</title>
<line x1="687.0" y1="670" x2="952.0" y2="670" stroke="#7540b8" stroke-width="2" marker-end="url(#control)"/>
<text class="message" x="820.0" y="637" text-anchor="middle" style="fill:#7540b8">GET / HTTP/1.1</text>
<text class="message" x="820.0" y="658" text-anchor="middle" style="fill:#7540b8">bytes restored by sshd</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc4254.html#section-7.2" target="_blank" rel="noopener"><title>Response relayed back through the same three legs · protocol reference</title>
<line x1="953.0" y1="740" x2="128.0" y2="740" stroke="#7540b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#control)"/>
<text class="message" x="260.0" y="707" text-anchor="middle" style="fill:#7540b8">Response relayed back</text>
<text class="message" x="260.0" y="728" text-anchor="middle" style="fill:#7540b8">through the same three legs</text>
</a>
<text x="30" y="790" font-size="16" fill="#475569">No proxy handshake at :18080. The command selects the destination before the application connects.</text>
<text x="30" y="828" font-size="14">Blue: TCP setup · purple: proxy control / HTTP · green: origin TLS · amber: encrypted SSH channel</text>
</svg>
