<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" role="img" aria-labelledby="title desc">
<title id="title">HTTPS through an HTTP proxy: CONNECT, then origin TLS</title>
<desc id="desc">Time runs downward. Narrow activation bars show handling or relay intervals, not CPU utilization. Each message links to its protocol specification. TCP connections and logical TLS endpoints are labeled separately.</desc>
<defs>
<marker id="tcp" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
<marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#7540b8"/></marker>
<marker id="tls" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#087f68"/></marker>
<marker id="ssh" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#a45b07"/></marker>
<marker id="vpn" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#a45b07"/></marker>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#253449} .message{font-size:17px} a:hover text{text-decoration:underline} a:focus{outline:2px solid #2563eb}</style>
<rect width="1080" height="900" rx="12" fill="#fff"/>
<text x="30" y="36" font-size="23" font-weight="700">HTTPS through an HTTP proxy: CONNECT, then origin TLS</text>
<text x="30" y="62" font-size="14" fill="#64748b">Time ↓ · bars = handling / relay intervals · click messages for protocol references ↗</text>
<rect x="24" y="215" width="1032" height="261" rx="8" fill="#f7f2fc"/>
<rect x="24" y="496" width="1032" height="307" rx="8" fill="#ebf8f2"/>
<line x1="120.0" x2="120.0" y1="140" y2="835" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="16.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="120.0" y="108" text-anchor="middle" font-size="18" font-weight="700">Application</text>
<text x="120.0" y="128" text-anchor="middle" font-size="14">TLS client</text>
<line x1="540.0" x2="540.0" y1="140" y2="835" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="436.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="540.0" y="108" text-anchor="middle" font-size="18" font-weight="700">HTTP proxy</text>
<text x="540.0" y="128" text-anchor="middle" font-size="14">TCP relay after CONNECT</text>
<line x1="960.0" x2="960.0" y1="140" y2="835" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="856.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="960.0" y="108" text-anchor="middle" font-size="18" font-weight="700">Origin</text>
<text x="960.0" y="128" text-anchor="middle" font-size="14">example.com:443 · TLS server</text>
<rect x="113.0" y="166" width="14" height="632" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="533.0" y="180" width="14" height="618" fill="#fff" stroke="#7540b8" stroke-width="1.6"/>
<rect x="953.0" y="365" width="14" height="433" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<a href="https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.6" target="_blank" rel="noopener"><title>TCP connection A → proxy · protocol reference</title>
<line x1="127.0" y1="185" x2="532.0" y2="185" stroke="#2563eb" stroke-width="2" marker-end="url(#tcp)"/>
<text class="message" x="330.0" y="173" text-anchor="middle" style="fill:#2563eb">TCP connection A → proxy</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.6" target="_blank" rel="noopener"><title>CONNECT example.com:443 HTTP/1.1 Host: example.com:443 · protocol reference</title>
<line x1="127.0" y1="265" x2="532.0" y2="265" stroke="#7540b8" stroke-width="2" marker-end="url(#control)"/>
<text class="message" x="330.0" y="232" text-anchor="middle" style="fill:#7540b8">CONNECT example.com:443 HTTP/1.1</text>
<text class="message" x="330.0" y="253" text-anchor="middle" style="fill:#7540b8">Host: example.com:443</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.6" target="_blank" rel="noopener"><title>Resolve example.com · protocol reference</title>
<path d="M547.0,325 h40 v22 h-40" fill="none" stroke="#7540b8" stroke-width="2" marker-end="url(#control)"/>
<text class="message" x="598.0" y="313" text-anchor="start" style="fill:#7540b8">Resolve example.com</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.6" target="_blank" rel="noopener"><title>TCP connection B → origin:443 · protocol reference</title>
<line x1="547.0" y1="375" x2="952.0" y2="375" stroke="#2563eb" stroke-width="2" marker-end="url(#tcp)"/>
<text class="message" x="750.0" y="363" text-anchor="middle" style="fill:#2563eb">TCP connection B → origin:443</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.6" target="_blank" rel="noopener"><title>HTTP/1.1 200 Connection established · protocol reference</title>
<line x1="533.0" y1="450" x2="128.0" y2="450" stroke="#7540b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#control)"/>
<text class="message" x="330.0" y="438" text-anchor="middle" style="fill:#7540b8">HTTP/1.1 200 Connection established</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc8446.html#section-2" target="_blank" rel="noopener"><title>TLS handshake bytes · protocol reference</title>
<line x1="127.0" y1="560" x2="532.0" y2="560" stroke="#087f68" stroke-width="2" marker-end="url(#tls)"/>
<text class="message" x="330.0" y="548" text-anchor="middle" style="fill:#087f68">TLS handshake bytes</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.6" target="_blank" rel="noopener"><title>Relay TLS handshake bytes · protocol reference</title>
<line x1="547.0" y1="620" x2="952.0" y2="620" stroke="#087f68" stroke-width="2" marker-end="url(#tls)"/>
<text class="message" x="750.0" y="608" text-anchor="middle" style="fill:#087f68">Relay TLS handshake bytes</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc8446.html#section-2" target="_blank" rel="noopener"><title>TLS handshake completes (logical) client ↔ origin; proxy relays both ways · protocol reference</title>
<line x1="953.0" y1="700" x2="128.0" y2="700" stroke="#087f68" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tls)"/>
<text class="message" x="330.0" y="667" text-anchor="middle" style="fill:#087f68">TLS handshake completes (logical)</text>
<text class="message" x="330.0" y="688" text-anchor="middle" style="fill:#087f68">client ↔ origin; proxy relays both ways</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.6" target="_blank" rel="noopener"><title>HTTPS inside origin TLS (logical) carried over TCP A + TCP B · protocol reference</title>
<line x1="127.0" y1="775" x2="952.0" y2="775" stroke="#087f68" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tls)"/>
<text class="message" x="330.0" y="742" text-anchor="middle" style="fill:#087f68">HTTPS inside origin TLS (logical)</text>
<text class="message" x="330.0" y="763" text-anchor="middle" style="fill:#087f68">carried over TCP A + TCP B</text>
</a>
<text x="30" y="836" font-size="16" fill="#475569">Green end-to-end arrows show TLS endpoints, not a direct TCP connection or a third TCP leg.</text>
<text x="30" y="878" font-size="14">Blue: TCP setup · purple: proxy control / HTTP · green: origin TLS · amber: encrypted SSH channel</text>
</svg>
