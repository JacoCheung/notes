<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc">
<title id="title">HTTP forward proxy: two separate TCP connections</title>
<desc id="desc">Time runs downward. Narrow activation bars show handling or relay intervals, not CPU utilization. Each message links to its protocol specification. TCP connections and logical TLS endpoints are labeled separately.</desc>
<defs>
<marker id="tcp" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
<marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#7540b8"/></marker>
<marker id="tls" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#087f68"/></marker>
<marker id="ssh" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#a45b07"/></marker>
<marker id="vpn" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#a45b07"/></marker>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#253449} .message{font-size:17px} a:hover text{text-decoration:underline} a:focus{outline:2px solid #2563eb}</style>
<rect width="1080" height="760" rx="12" fill="#fff"/>
<text x="30" y="36" font-size="23" font-weight="700">HTTP forward proxy: two separate TCP connections</text>
<text x="30" y="62" font-size="14" fill="#64748b">Time ↓ · bars = handling / relay intervals · click messages for protocol references ↗</text>
<rect x="24" y="215" width="1032" height="452" rx="8" fill="#f7f2fc"/>
<line x1="120.0" x2="120.0" y1="140" y2="695" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="16.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="120.0" y="108" text-anchor="middle" font-size="18" font-weight="700">Application</text>
<text x="120.0" y="128" text-anchor="middle" font-size="14">Mac · HTTP client</text>
<line x1="540.0" x2="540.0" y1="140" y2="695" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="436.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="540.0" y="108" text-anchor="middle" font-size="18" font-weight="700">HTTP proxy</text>
<text x="540.0" y="128" text-anchor="middle" font-size="14">proxy.example:18888</text>
<line x1="960.0" x2="960.0" y1="140" y2="695" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="856.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="960.0" y="108" text-anchor="middle" font-size="18" font-weight="700">Origin</text>
<text x="960.0" y="128" text-anchor="middle" font-size="14">example.com:80</text>
<rect x="113.0" y="166" width="14" height="494" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="533.0" y="180" width="14" height="480" fill="#fff" stroke="#7540b8" stroke-width="1.6"/>
<rect x="953.0" y="405" width="14" height="190" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<a href="https://www.rfc-editor.org/rfc/rfc9112.html#section-3.2.2" target="_blank" rel="noopener"><title>TCP connection A → proxy · protocol reference</title>
<line x1="127.0" y1="185" x2="532.0" y2="185" stroke="#2563eb" stroke-width="2" marker-end="url(#tcp)"/>
<text class="message" x="330.0" y="173" text-anchor="middle" style="fill:#2563eb">TCP connection A → proxy</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc9112.html#section-3.2.2" target="_blank" rel="noopener"><title>GET http://example.com/docs HTTP/1.1 Host: example.com · protocol reference</title>
<line x1="127.0" y1="265" x2="532.0" y2="265" stroke="#7540b8" stroke-width="2" marker-end="url(#control)"/>
<text class="message" x="330.0" y="232" text-anchor="middle" style="fill:#7540b8">GET http://example.com/docs HTTP/1.1</text>
<text class="message" x="330.0" y="253" text-anchor="middle" style="fill:#7540b8">Host: example.com</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc9112.html#section-3.2.2" target="_blank" rel="noopener"><title>Resolve example.com · protocol reference</title>
<path d="M547.0,340 h40 v22 h-40" fill="none" stroke="#7540b8" stroke-width="2" marker-end="url(#control)"/>
<text class="message" x="598.0" y="328" text-anchor="start" style="fill:#7540b8">Resolve example.com</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc9112.html#section-3.2.2" target="_blank" rel="noopener"><title>TCP connection B → origin · protocol reference</title>
<line x1="547.0" y1="410" x2="952.0" y2="410" stroke="#2563eb" stroke-width="2" marker-end="url(#tcp)"/>
<text class="message" x="750.0" y="398" text-anchor="middle" style="fill:#2563eb">TCP connection B → origin</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc9112.html#section-3.2.2" target="_blank" rel="noopener"><title>GET /docs HTTP/1.1 Host: example.com · protocol reference</title>
<line x1="547.0" y1="485" x2="952.0" y2="485" stroke="#7540b8" stroke-width="2" marker-end="url(#control)"/>
<text class="message" x="750.0" y="452" text-anchor="middle" style="fill:#7540b8">GET /docs HTTP/1.1</text>
<text class="message" x="750.0" y="473" text-anchor="middle" style="fill:#7540b8">Host: example.com</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc9112.html#section-3.2.2" target="_blank" rel="noopener"><title>HTTP response · protocol reference</title>
<line x1="953.0" y1="560" x2="548.0" y2="560" stroke="#7540b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#control)"/>
<text class="message" x="750.0" y="548" text-anchor="middle" style="fill:#7540b8">HTTP response</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc9112.html#section-3.2.2" target="_blank" rel="noopener"><title>HTTP response · protocol reference</title>
<line x1="533.0" y1="635" x2="128.0" y2="635" stroke="#7540b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#control)"/>
<text class="message" x="330.0" y="623" text-anchor="middle" style="fill:#7540b8">HTTP response</text>
</a>
<text x="30" y="700" font-size="16" fill="#475569">The proxy parses HTTP. TCP A and TCP B have independent sequence numbers and flow control.</text>
<text x="30" y="738" font-size="14">Blue: TCP setup · purple: proxy control / HTTP · green: origin TLS · amber: encrypted SSH channel</text>
</svg>
