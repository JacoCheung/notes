<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1020" viewBox="0 0 1080 1020" role="img" aria-labelledby="title desc">
<title id="title">Packet VPN (L3): the inner TCP connection survives the tunnel</title>
<desc id="desc">Time runs downward. Narrow activation bars show handling or relay intervals, not CPU utilization. Each message links to its protocol specification. TCP connections and logical TLS endpoints are labeled separately.</desc>
<defs>
<marker id="tcp" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
<marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#7540b8"/></marker>
<marker id="tls" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#087f68"/></marker>
<marker id="ssh" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#a45b07"/></marker>
<marker id="vpn" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#a45b07"/></marker>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#253449} .message{font-size:17px} a:hover text{text-decoration:underline} a:focus{outline:2px solid #2563eb}</style>
<rect width="1080" height="1020" rx="12" fill="#fff"/>
<text x="30" y="36" font-size="23" font-weight="700">Packet VPN (L3): the inner TCP connection survives the tunnel</text>
<text x="30" y="62" font-size="14" fill="#64748b">Time ↓ · bars = handling / relay intervals · click messages for protocol references ↗</text>
<rect x="24" y="228" width="1032" height="62" rx="8" fill="#fff5e8"/>
<rect x="24" y="468" width="1032" height="62" rx="8" fill="#fff5e8"/>
<rect x="24" y="785" width="1032" height="66" rx="8" fill="#fff5e8"/>
<line x1="120.0" x2="120.0" y1="140" y2="955" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="16.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="120.0" y="108" text-anchor="middle" font-size="18" font-weight="700">Client TCP/IP</text>
<text x="120.0" y="128" text-anchor="middle" font-size="14">connect(origin_ip, 443)</text>
<line x1="400.0" x2="400.0" y1="140" y2="955" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="296.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="400.0" y="108" text-anchor="middle" font-size="18" font-weight="700">VPN interface</text>
<text x="400.0" y="128" text-anchor="middle" font-size="14">L3 packets selected by policy</text>
<line x1="680.0" x2="680.0" y1="140" y2="955" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="576.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="680.0" y="108" text-anchor="middle" font-size="18" font-weight="700">VPN gateway</text>
<text x="680.0" y="128" text-anchor="middle" font-size="14">decapsulation / routing / NAT</text>
<line x1="960.0" x2="960.0" y1="140" y2="955" stroke="#a8b5c6" stroke-dasharray="5 6"/>
<rect x="856.0" y="85" width="208" height="55" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="960.0" y="108" text-anchor="middle" font-size="18" font-weight="700">Origin TCP/IP</text>
<text x="960.0" y="128" text-anchor="middle" font-size="14">TLS server on port 443</text>
<rect x="113.0" y="166" width="14" height="751" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="393.0" y="180" width="14" height="737" fill="#fff" stroke="#a45b07" stroke-width="1.6"/>
<rect x="673.0" y="260" width="14" height="657" fill="#fff" stroke="#a45b07" stroke-width="1.6"/>
<rect x="953.0" y="335" width="14" height="582" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<a href="https://www.wireguard.com/protocol/" target="_blank" rel="noopener"><title>Inner IP / TCP SYN destination = origin:443 · protocol reference</title>
<line x1="127.0" y1="195" x2="392.0" y2="195" stroke="#2563eb" stroke-width="2" marker-end="url(#tcp)"/>
<text class="message" x="260.0" y="162" text-anchor="middle" style="fill:#2563eb">Inner IP / TCP SYN</text>
<text class="message" x="260.0" y="183" text-anchor="middle" style="fill:#2563eb">destination = origin:443</text>
</a>
<a href="https://www.wireguard.com/protocol/" target="_blank" rel="noopener"><title>Encrypt whole inner IP packet outer UDP → VPN gateway · protocol reference</title>
<line x1="407.0" y1="275" x2="672.0" y2="275" stroke="#a45b07" stroke-width="2" marker-end="url(#vpn)"/>
<text class="message" x="540.0" y="242" text-anchor="middle" style="fill:#a45b07">Encrypt whole inner IP packet</text>
<text class="message" x="540.0" y="263" text-anchor="middle" style="fill:#a45b07">outer UDP → VPN gateway</text>
</a>
<a href="https://www.wireguard.com/protocol/" target="_blank" rel="noopener"><title>Route inner TCP SYN optional NAT on source · protocol reference</title>
<line x1="687.0" y1="355" x2="952.0" y2="355" stroke="#2563eb" stroke-width="2" marker-end="url(#tcp)"/>
<text class="message" x="820.0" y="322" text-anchor="middle" style="fill:#2563eb">Route inner TCP SYN</text>
<text class="message" x="820.0" y="343" text-anchor="middle" style="fill:#2563eb">optional NAT on source</text>
</a>
<a href="https://www.wireguard.com/protocol/" target="_blank" rel="noopener"><title>TCP SYN-ACK response · protocol reference</title>
<line x1="953.0" y1="435" x2="688.0" y2="435" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tcp)"/>
<text class="message" x="820.0" y="423" text-anchor="middle" style="fill:#2563eb">TCP SYN-ACK response</text>
</a>
<a href="https://www.wireguard.com/protocol/" target="_blank" rel="noopener"><title>Encrypt return IP packet outer UDP → VPN client · protocol reference</title>
<line x1="673.0" y1="515" x2="408.0" y2="515" stroke="#a45b07" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#vpn)"/>
<text class="message" x="540.0" y="482" text-anchor="middle" style="fill:#a45b07">Encrypt return IP packet</text>
<text class="message" x="540.0" y="503" text-anchor="middle" style="fill:#a45b07">outer UDP → VPN client</text>
</a>
<a href="https://www.wireguard.com/protocol/" target="_blank" rel="noopener"><title>Restore inner IP / SYN-ACK · protocol reference</title>
<line x1="393.0" y1="595" x2="128.0" y2="595" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tcp)"/>
<text class="message" x="260.0" y="583" text-anchor="middle" style="fill:#2563eb">Restore inner IP / SYN-ACK</text>
</a>
<a href="https://www.wireguard.com/protocol/" target="_blank" rel="noopener"><title>ACK follows tunnel path inner TCP established · protocol reference</title>
<line x1="127.0" y1="685" x2="952.0" y2="685" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tcp)"/>
<text class="message" x="260.0" y="652" text-anchor="middle" style="fill:#2563eb">ACK follows tunnel path</text>
<text class="message" x="260.0" y="673" text-anchor="middle" style="fill:#2563eb">inner TCP established</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc8446.html#section-2" target="_blank" rel="noopener"><title>IP / TCP / origin TLS · protocol reference</title>
<line x1="127.0" y1="760" x2="392.0" y2="760" stroke="#087f68" stroke-width="2" marker-end="url(#tls)"/>
<text class="message" x="260.0" y="748" text-anchor="middle" style="fill:#087f68">IP / TCP / origin TLS</text>
</a>
<a href="https://www.wireguard.com/protocol/" target="_blank" rel="noopener"><title>Whole IP packet encrypted inside VPN transport · protocol reference</title>
<line x1="407.0" y1="835" x2="672.0" y2="835" stroke="#a45b07" stroke-width="2" marker-end="url(#vpn)"/>
<text class="message" x="540.0" y="802" text-anchor="middle" style="fill:#a45b07">Whole IP packet encrypted</text>
<text class="message" x="540.0" y="823" text-anchor="middle" style="fill:#a45b07">inside VPN transport</text>
</a>
<a href="https://www.rfc-editor.org/rfc/rfc8446.html#section-2" target="_blank" rel="noopener"><title>IP / TCP / origin TLS · protocol reference</title>
<line x1="687.0" y1="910" x2="952.0" y2="910" stroke="#087f68" stroke-width="2" marker-end="url(#tls)"/>
<text class="message" x="820.0" y="898" text-anchor="middle" style="fill:#087f68">IP / TCP / origin TLS</text>
</a>
<text x="30" y="958" font-size="16" fill="#475569">Routing / NAT gateway: forwards packets; it does not open a second application TCP connection.</text>
<text x="30" y="998" font-size="14">Blue: inner TCP establishment · amber: encrypted VPN packets · green: origin TLS carried inside TCP</text>
</svg>
