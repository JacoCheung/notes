<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="GPU, HPC, and systems performance engineering notes by Jaco Cheung.">
<title>Blog · Jaco Cheung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/navigation-drawer.js" defer></script>
<script src="assets/index.js" defer></script>
</head>
<body class="blog-index-page">

<header class="site-nav">
  <nav class="site-nav-inner" aria-label="Site navigation">
    <a class="site-brand" href="index.html"><strong>Jaco</strong> Cheung</a>
    <div class="site-nav-links">
      <a class="active" id="nav-notes" href="index.html"></a>
      <a class="nav-github" href="https://github.com/JacoCheung/notes">github</a>
      <button id="lang-toggle" type="button"></button>
      <button class="theme-icon" id="theme-toggle" type="button"></button>
    </div>
  </nav>
</header>

<div class="wrap with-side-nav">
  <aside class="series-nav reveal" id="series-nav" aria-label="Blog series">
    <section class="sidebar-section">
      <div class="nav-title" id="series-nav-title"></div>
      <ul id="series-nav-list"></ul>
    </section>

  </aside>

  <main class="main-col">
    <header class="site-header reveal">
      <h1>blog</h1>
      <p class="tagline" id="tagline"></p>
    </header>

    <form class="post-search" id="post-search" role="search" aria-labelledby="search-label">
      <label id="search-label" for="search-input"></label>
      <div class="post-search-field">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m15.5 15.5 5 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        <input id="search-input" type="search" aria-controls="post-list" autocomplete="off" spellcheck="false" disabled>
        <button id="clear-search" type="button" hidden></button>
      </div>
      <p class="search-status" id="search-status" role="status" aria-live="polite" aria-atomic="true"></p>
    </form>

    <div class="active-filter" id="active-filter" aria-live="polite">
      <strong id="active-filter-label"></strong>
      <button id="clear-filter" type="button"></button>
    </div>

    <div id="post-list">
      <div class="empty" id="loading-msg"></div>
    </div>

    <footer class="reveal">
      <p><a href="https://github.com/JacoCheung/notes">github.com/JacoCheung/notes</a></p>
    </footer>
  </main>
</div>

</body>
</html>
